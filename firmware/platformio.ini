; RUNS ON: Arduino Uno. Houston pan-tilt + laser firmware.
;   Build:            pio run              (from this folder)
;   Build + upload:   pio run -t upload
;   Serial monitor:   pio device monitor   (115200 baud, type commands, ENTER)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
lib_deps = arduino-libraries/Servo@^1.2.2
